<!DOCTYPE html>
<html>

<head>
    <title>Sorteio</title>
    <link href="sorteio.css" rel="stylesheet" />
</head>

<body>

    <form onsubmit="adicionarParticipante(event);">
        <label for="input_nome">Nome:</label>
        <input type="text" id="input_nome" required minlength="2" />
        <button type="submit" id="btn_salvar">Adicionar</button>
        <button type="button" id="btn_cancelar" onclick="cancelarEdicao()" style="display: none;">Cancelar</button>
        <span id="mensagem_edicao"></span>
    </form>

    <div>
        <table>
            <thead>
                <tr>
                    <td>Id</td>
                    <td>Nome</td>
                    <td>Ações</td>
                </tr>
            </thead>
            <tbody id="lista">
                <tr>
                    <td colspan="3">Nenhum participante</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <button id="sortear" onclick="sortear()">Sortear</button>
        <button id="ordenar_crescente" onclick="ordenarCrescente()">Ordenar Crescente ⬆️</button>
        <button id="ordenar_decrescente" onclick="ordenarDecrescente()">Ordenar Decrescente ⬇️</button>
    </div>
    <script src="sorteio.js"></script>
</body>

</html>
